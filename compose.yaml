services:
  family-box:
    image: "message-box-family-box:${GIT_REVISION:-development}"
    build:
      context: .
      args:
        GIT_REVISION: "${GIT_REVISION:-unknown}"
    init: true
    restart: unless-stopped
    shm_size: 256mb
    env_file: .env
    environment:
      HOST: 0.0.0.0
      FAMILY_BOX_BIND_IP: "${FAMILY_BOX_BIND_IP:-127.0.0.1}"
      DATABASE_PATH: /app/data/family-box.db
      AUDIO_DIR: /app/data/audio
      ADMIN_ORIGIN: "${ADMIN_ORIGIN:-http://127.0.0.1:8787}"
      MOCK_ADAPTER: "${MOCK_ADAPTER:-true}"
      FIRMWARE_DIR: /app/data/firmware
    ports:
      # Set FAMILY_BOX_BIND_IP to the server's private LAN address in a real
      # installation. The loopback default avoids accidental network exposure.
      - "${FAMILY_BOX_BIND_IP:-127.0.0.1}:8787:8787"
    volumes:
      - family-box-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

volumes:
  family-box-data:
