[platformio]
; The supported ESP32-S3 board (Amazon ASIN B0CLD4QKT1) is N16R8:
; 16 MB quad flash plus 8 MB octal PSRAM.
default_envs = esp32-s3-wroom-1-n16r8

[env]
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D BOARD_HAS_PSRAM
  -D CORE_DEBUG_LEVEL=1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
lib_deps =
  links2004/WebSockets@2.7.3
  bblanchon/ArduinoJson@7.4.3

; Production hardware: Diymore ESP32-S3 DevKitC-1 N16R8, ASIN B0CLD4QKT1.
[env:esp32-s3-wroom-1-n16r8]
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
